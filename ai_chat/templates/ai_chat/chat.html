<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Chatbot - Django & Gemini</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .chat-container { width: 500px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .user-msg { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .bot-msg { background: #e9ecef; color: #333; white-space: pre-wrap; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>AI Chatbot (Gemini)</h2>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Nhập câu hỏi...">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    function getCSRFToken() {
        let cookieValue = null;
        let cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            let cookie = cookies[i].trim();
            if (cookie.startsWith('csrftoken=')) {
                cookieValue = cookie.substring('csrftoken='.length);
                break;
            }
        }
        return cookieValue;
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML += `<div class="message user-msg">${message}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const formData = new FormData();
        formData.append("message", message);

        try {
            const response = await fetch("/api/chat/", {
                method: "POST",
                headers: { "X-CSRFToken": getCSRFToken() },
                body: formData
            });
            const data = await response.json();
            
            if (data.reply) {
                chatBox.innerHTML += `<div class="message bot-msg">${data.reply}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message bot-msg">Lỗi: ${data.error}</div>`;
            }
        } catch (err) {
            chatBox.innerHTML += `<div class="message bot-msg">Không thể kết nối đến server.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
